name: Update deals

# GitHub wakes this up every 2 hours; scripts/should-run.ts decides if an update is actually due.
# Change the interval without touching code: repo Settings → Secrets and variables → Actions → Variables →
#   UPDATE_INTERVAL_HOURS (default 10). E.g. set 4 during Black Friday week.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if an update isn't due yet"
        type: boolean
        default: true

concurrency:
  group: update-deals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      UPDATE_INTERVAL_HOURS: ${{ vars.UPDATE_INTERVAL_HOURS || '10' }}
      AI_MINUTES_PER_RUN: ${{ vars.AI_MINUTES_PER_RUN || '20' }}
      AI_MAX_BATCHES_PER_RUN: ${{ vars.AI_MAX_BATCHES_PER_RUN || '200' }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Is an update due?
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: npx tsx scripts/should-run.ts

      - name: Scrape retailers + OzBargain
        if: steps.gate.outputs.run == 'true'
        run: npm run scrape

      # Runs even if one scraper errored, so AI parsing + ranking still happen for the sources that worked.
      - name: AI parsing + ranking
        if: always() && steps.gate.outputs.run == 'true'
        run: npm run process
